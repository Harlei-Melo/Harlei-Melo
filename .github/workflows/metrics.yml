name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          committer_message: "chore: update metrics [skip ci]"

          # --- CONFIGURAÇÃO VALIDADA ---
          user: Harlei-Melo
          template: classic
          base: "" # Limpa toda a "sujeira" (headers, metadados, etc)
          config_display: large
          config_timezone: America/Sao_Paulo

          # --- ATIVAÇÃO DE RECURSOS VIA QUERY ---
          # Já que o seu Action não aceita 'plugin_...' como input direto,
          # passamos as instruções dentro do 'query', que é um campo válido.
          query: '{"isocalendar": true, "isocalendar.duration": "full-year", "streak": true}'

          # --- ESTILIZAÇÃO RAINBOW VIA CSS ---
          # Esta é a forma mais poderosa de personalizar: injetamos o CSS direto no SVG.
          # Resolve o problema das cores e do tema sem precisar de inputs inexistentes.
          extras_css: |
            /* Fundo Escuro Profundo */
            svg { background: #050505 !important; border-radius: 14px; }

            /* Efeito Rainbow no Gráfico 3D (Isocalendar) */
            /* L0: Vazio | L1: Azul | L2: Verde | L3: Amarelo | L4: Rosa/Vermelho */
            .isocalendar .day-L0 { fill: #161b22 !important; }
            .isocalendar .day-L1 { fill: #0077ff !important; }
            .isocalendar .day-L2 { fill: #00ff88 !important; }
            .isocalendar .day-L3 { fill: #ffcc00 !important; }
            .isocalendar .day-L4 { fill: #ff0055 !important; }

            /* Estilização da Streak (Sequência) */
            .streak { fill: #ffffff !important; font-family: monospace; }

            /* Remove textos genéricos que sobram */
            .header, .footer, h2 { display: none !important; }
