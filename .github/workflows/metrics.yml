name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          committer_message: "chore: update metrics [skip ci]"

          # --- CONFIGURAÇÃO MINIMALISTA ---
          user: Harlei-Melo
          template: classic
          base: "" # Remove TUDO (foto, repositórios, etc) para focar no gráfico
          config_display: large

          # --- RAINBOW GRADIENT (Cores Reais) ---
          # A primeira cor (#161b22) é o fundo do GitHub Dark para dias vazios.
          # As seguintes formam o arco-íris completo.
          config_colors: gradient(#161b22, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3)

          # --- GRÁFICO 3D (O Coração do Design) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- STREAK (Sequência Máxima) ---
          plugin_streat: yes
          plugin_streat_sections: timeline
