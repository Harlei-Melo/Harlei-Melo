name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          committer_message: "chore: update metrics [skip ci]"

          # --- CONFIGURAÇÕES DE FOCO ---
          user: Harlei-Melo
          template: classic
          base: "" # Mantém o fundo limpo sem header/footer
          config_timezone: America/Sao_Paulo
          config_display: large

          # --- TEMA E CORES ---
          theme: night # Fundo escuro profundo
          # Aqui definimos as cores dos blocos do gráfico 3D (do menos ativo ao mais ativo)
          # Usei um gradiente de Roxo para Rosa/Neon para combinar com a estética "Design Engineer"
          config_colors: gradient(#161b22, #4c1d95, #7c3aed, #db2777, #f472b6)

          # --- O GRÁFICO 3D (Isocalendar) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- STREAK (Apenas a máxima e atual) ---
          plugin_streat: yes
          plugin_streat_sections: timeline
          # Isso vai mostrar a sua "sequência" de contribuições de forma elegante
