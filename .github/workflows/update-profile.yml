name: Generate Event Horizon

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # --- AQUI ESTÁ A MUDANÇA MÁGICA ---
      - name: Build Application
        run: npm run build
        # Compila o site antes de rodar. Zero delay.

      - name: Start Production Server
        run: |
          npm run preview > server.log 2>&1 &
          echo "Server PID: $!"

      - name: Wait for Server
        # Espera o servidor responder na porta 5173
        run: npx wait-on http://127.0.0.1:5173 -t 60000

      - name: Debug Logs (Caso Falhe)
        if: failure()
        run: cat server.log
      # ----------------------------------

      - name: Capture Animation
        run: npm run capture

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update singularity sequence [skip ci]"
          file_pattern: "github-profile.gif"
          branch: main
