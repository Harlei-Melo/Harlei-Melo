name: Update Galaxy Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          npm install dotenv
          node scripts/generate.js

      - name: Push
        run: |
          git config user.name "Galaxy Bot"
          git config user.email "actions@github.com"
          git add github-profile.svg
          git commit -m "update: svg profile [skip ci]" || exit 0
          git push
