name: Generate Event Horizon

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Start Render Server
        # Roda o servidor e salva o log em server.log para debug
        run: |
          npm run dev > server.log 2>&1 &
          echo "Processo do servidor iniciado. PID: $!"

      - name: Wait for Server
        # Tenta conectar por 60 segundos
        run: npx wait-on http://127.0.0.1:5173 -t 60000

      - name: Debug Server Logs (If Failed)
        if: failure()
        run: |
          echo "=== LOGS DO SERVIDOR ==="
          cat server.log

      - name: Capture Animation
        run: npm run capture

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update singularity sequence [skip ci]"
          file_pattern: "github-profile.gif"
          branch: main
