name: Generate Event Horizon

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Start Static Server
        # Usa npx http-server direto (mais estável para CI)
        # -p 5173: Porta
        # -a 127.0.0.1: Bind apenas no localhost
        # dist: Pasta para servir
        run: |
          npx http-server dist -p 5173 -a 127.0.0.1 --cors -c-1 > server.log 2>&1 &
          echo "Server PID: $!"

      - name: Wait for Server
        run: npx wait-on http://127.0.0.1:5173 -t 60000

      - name: Capture Animation
        run: npm run capture

      - name: Debug Server Logs (Always run if failed)
        if: failure()
        run: cat server.log

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update singularity sequence [skip ci]"
          file_pattern: "github-profile.gif"
          branch: main
